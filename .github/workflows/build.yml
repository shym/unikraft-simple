name: Build and run

on: push

env:
  KRAFTKIT: "0.10.1"

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install extra packages
        run: |
          sudo apt-get install -y strace qemu-system-arm
      - name: Install kraft
        run: |
          mkdir -p bin
          cd bin
          wget https://github.com/unikraft/kraftkit/releases/download/v${KRAFTKIT}/kraft_${KRAFTKIT}_linux_amd64.tar.gz
          tar xvaf *.tar.gz
          rm *.tar.gz
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Build
        run: |
          kraft build
      - name: Display the configuration
        run: |
          cat .config.simple_qemu-*
        if: ${{ always() }}
      - name: Run with no argument
        run: |
          strace -e execve -f kraft run .
      - name: Run with arguments
        run: |
          kraft run . -- arg1 arg2 arg3 arg4 arg5
      - name: Run with --
        run: |
          kraft run . -- arg1 arg2 arg3 -- arg4 arg5
